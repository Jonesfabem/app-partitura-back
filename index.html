<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Partituras 🎼</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 30px; background-color: #f4f4f9; color: #333;}
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); max-width: 100%; margin: auto; }
        h1 { color: #2c3e50; font-size: 22px;}
        input[type="file"] { margin: 20px 0; border: 1px solid #ccc; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box;}
        button { background-color: #27ae60; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;}
        #status { margin-top: 20px; font-weight: bold; font-size: 14px; word-break: break-all;}
    </style>
</head>
<body>
    <div class="container">
        <h1>🎼 Transforme sua Partitura</h1>
        <p>Envie um arquivo do celular e converta gratuitamente.</p>
        
        <input type="file" id="fileInput" accept=".pdf, .png, .jpg, .jpeg">
        <br>
        <button onclick="converterArquivo()">Converter Agora</button>
        
        <p id="status"></p>
    </div>

    <script>
        async function converterArquivo() {
            const fileInput = document.getElementById("fileInput");
            const statusText = document.getElementById("status");

            if (fileInput.files.length === 0) {
                statusText.innerText = "Por favor, selecione um arquivo primeiro.";
                statusText.style.color = "red";
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file);

            statusText.innerText = "Processando... O servidor no celular pode demorar um minutinho na 1ª vez. Aguarde!";
            statusText.style.color = "blue";

            try {
                const response = await fetch("https://api-partitura-v2.onrender.com/upload", {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "partitura_convertida.mid";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    statusText.innerText = "🎉 Conversão concluída! O arquivo foi baixado.";
                    statusText.style.color = "green";
                } else {
                    statusText.innerText = "Erro ao converter. Verifique o arquivo.";
                    statusText.style.color = "red";
                }
            } catch (error) {
                statusText.innerText = "Erro de conexão. Tente novamente em alguns segundos.";
                statusText.style.color: "red";
            }
        }
    </script>
</body>
</html>
